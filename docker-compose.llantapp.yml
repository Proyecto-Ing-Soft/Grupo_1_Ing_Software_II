services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.15
    command: >
      /usr/local/bin/etcd
      --name etcd1
      --data-dir /etcd-data
      --initial-advertise-peer-urls http://etcd1:2380
      --listen-peer-urls http://0.0.0.0:2380
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd1:2379
      --initial-cluster-token etcd-cluster-1
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new
      --enable-v2=true
    networks: [llantapp_net]

  etcd2:
    image: quay.io/coreos/etcd:v3.5.15
    command: >
      /usr/local/bin/etcd
      --name etcd2
      --data-dir /etcd-data
      --initial-advertise-peer-urls http://etcd2:2380
      --listen-peer-urls http://0.0.0.0:2380
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd2:2379
      --initial-cluster-token etcd-cluster-1
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new
      --enable-v2=true
    networks: [llantapp_net]

  etcd3:
    image: quay.io/coreos/etcd:v3.5.15
    command: >
      /usr/local/bin/etcd
      --name etcd3
      --data-dir /etcd-data
      --initial-advertise-peer-urls http://etcd3:2380
      --listen-peer-urls http://0.0.0.0:2380
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd3:2379
      --initial-cluster-token etcd-cluster-1
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new
      --enable-v2=true
    networks: [llantapp_net]

  node1:
    image: ghcr.io/zalando/spilo-16:3.3-p3
    hostname: node1
    environment:
      SCOPE: llantapp
      NAME: node1
      ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_NAME: node1
      PATRONI_SCOPE: llantapp
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: node1:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: node1:5432
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: 1234
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replicator
      PATRONI_SYNCHRONOUS_MODE: "true"
      PATRONI_SYNCHRONOUS_NODE_COUNT: "1"
      PATRONI_POSTGRESQL_PARAMETERS_shared_buffers: 512MB
      PATRONI_POSTGRESQL_PARAMETERS_max_connections: "200"
      PATRONI_POSTGRESQL_PARAMETERS_wal_level: replica
      PATRONI_POSTGRESQL_PARAMETERS_hot_standby: "on"
      PATRONI_POSTGRESQL_PARAMETERS_max_wal_senders: "10"
      PATRONI_POSTGRESQL_PARAMETERS_max_replication_slots: "10"
      PATRONI_POSTGRESQL_PARAMETERS_shared_preload_libraries: pg_stat_statements
    volumes:
      - node1-data:/home/postgres/pgdata
    depends_on: [etcd1, etcd2, etcd3]
    networks: [llantapp_net]

  node2:
    image: ghcr.io/zalando/spilo-16:3.3-p3
    hostname: node2
    environment:
      SCOPE: llantapp
      NAME: node2
      ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_NAME: node2
      PATRONI_SCOPE: llantapp
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: node2:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: node2:5432
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: 1234
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replicator
      PATRONI_SYNCHRONOUS_MODE: "true"
      PATRONI_SYNCHRONOUS_NODE_COUNT: "1"
      PATRONI_POSTGRESQL_PARAMETERS_shared_buffers: 512MB
      PATRONI_POSTGRESQL_PARAMETERS_max_connections: "200"
      PATRONI_POSTGRESQL_PARAMETERS_wal_level: replica
      PATRONI_POSTGRESQL_PARAMETERS_hot_standby: "on"
      PATRONI_POSTGRESQL_PARAMETERS_max_wal_senders: "10"
      PATRONI_POSTGRESQL_PARAMETERS_max_replication_slots: "10"
      PATRONI_POSTGRESQL_PARAMETERS_shared_preload_libraries: pg_stat_statements
    volumes:
      - node2-data:/home/postgres/pgdata
    depends_on: [etcd1, etcd2, etcd3]
    networks: [llantapp_net]

  node3:
    image: ghcr.io/zalando/spilo-16:3.3-p3
    hostname: node3
    environment:
      SCOPE: llantapp
      NAME: node3
      ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_NAME: node3
      PATRONI_SCOPE: llantapp
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: node3:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: node3:5432
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: 1234
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replicator
      PATRONI_SYNCHRONOUS_MODE: "true"
      PATRONI_SYNCHRONOUS_NODE_COUNT: "1"
      PATRONI_POSTGRESQL_PARAMETERS_shared_buffers: 512MB
      PATRONI_POSTGRESQL_PARAMETERS_max_connections: "200"
      PATRONI_POSTGRESQL_PARAMETERS_wal_level: replica
      PATRONI_POSTGRESQL_PARAMETERS_hot_standby: "on"
      PATRONI_POSTGRESQL_PARAMETERS_max_wal_senders: "10"
      PATRONI_POSTGRESQL_PARAMETERS_max_replication_slots: "10"
      PATRONI_POSTGRESQL_PARAMETERS_shared_preload_libraries: pg_stat_statements
    volumes:
      - node3-data:/home/postgres/pgdata
    depends_on: [etcd1, etcd2, etcd3]
    networks: [llantapp_net]

  haproxy:
    image: haproxy:2.9
    depends_on: [node1, node2, node3]
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"   # write
      - "5435:5435"   # read
    networks: [llantapp_net]

networks:
  llantapp_net: {}

volumes:
  node1-data: {}
  node2-data: {}
  node3-data: {}
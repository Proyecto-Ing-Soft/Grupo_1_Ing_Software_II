<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <!-- Palette: negro, gris y azul noche -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>   <!-- negro profundo -->
      <stop offset="55%" stop-color="#0e1319"/>  <!-- gris grafito -->
      <stop offset="100%" stop-color="#0a1a2b"/> <!-- azul noche -->
    </linearGradient>

    <!-- suave lavado diagonal para dar profundidad -->
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2b" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0a1a2b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0a1a2b" stop-opacity="0"/>
    </linearGradient>

    <!-- viñetas superior e inferior para foco central -->
    <radialGradient id="vTop" cx="540" cy="0" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vBottom" cx="540" cy="1920" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- halo circular muy sutil (evoca llanta/superficie) sin convertirse en elemento -->
    <radialGradient id="rings" cx="540" cy="960" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="60%" stop-color="#243447" stop-opacity="0"/>
      <stop offset="95%" stop-color="#243447" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#243447" stop-opacity="0"/>
    </radialGradient>
    <mask id="ringsMask">
      <rect width="1080" height="1920" fill="black"/>
      <circle cx="540" cy="960" r="650" fill="white" />
    </mask>

    <!-- grano sutil vectorial para textura (sin raster) -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- capas -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#wash)"/>
  <rect width="1080" height="1920" fill="url(#vTop)"/>
  <rect width="1080" height="1920" fill="url(#vBottom)"/>
  <rect width="1080" height="1920" fill="url(#rings)" mask="url(#ringsMask)"/>
  <rect width="1080" height="1920" filter="url(#grain)" opacity="0.06"/>
</svg>
